name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Lint CSS
        run: npm run lint:css
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test:ci
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      # The deploy workflow builds on master; catch a broken build here,
      # before it is merged. (Typecheck above already ran tsc.)
      - name: Build
        run: npx vite build
