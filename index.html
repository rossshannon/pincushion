<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Pincushion — Enhanced Pinboard Bookmarklet"
    />
    <title>Pincushion — Save a Bookmark</title>

    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!--
      Open the TCP+TLS connection to the API bridge while the JS bundle is
      still downloading, so the first real request doesn't pay for the
      handshake. `crossorigin` matters: our API calls are anonymous CORS
      requests and browsers keep a separate connection pool for those.
      %VITE_PINBOARD_BRIDGE_URL% is substituted by Vite from .env.
    -->
    <link rel="preconnect" href="%VITE_PINBOARD_BRIDGE_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Wake the bridge up as early as possible. A Heroku dyno that has gone to
      sleep takes several seconds to boot, and nothing but a real HTTP request
      starts that clock. This fires before React has even been parsed. It is a
      no-cors, fire-and-forget ping: the response is deliberately ignored.
    -->
    <script>
      try {
        fetch('%VITE_PINBOARD_BRIDGE_URL%/health', {
          mode: 'no-cors',
          cache: 'no-store',
          credentials: 'omit',
        }).catch(function () {});
      } catch (err) {
        /* fetch unavailable: nothing to warm up with */
      }
    </script>

    <!--
      Open Sans 300 is only used for the tag counts inside the autocomplete
      menu, so it must never block first paint: load it asynchronously via
      the media-swap trick and let text render in the fallback font meanwhile.
      No `crossorigin` on the stylesheet: a plain (non-CORS) stylesheet fetch
      reuses the plain preconnect above, whereas the font files it references
      are CORS fetches and use the `crossorigin` preconnect to fonts.gstatic.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Open+Sans:300&display=swap"
      media="print"
      onload="this.media='all'"
      referrerpolicy="no-referrer"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Open+Sans:300&display=swap"
        referrerpolicy="no-referrer"
      />
    </noscript>

    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="https://pinboard.in/favicon.ico"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <noscript>
      <p>
        This submission form for
        <a href="https://pinboard.in">Pinboard</a> requires JavaScript to
        function. Please either
        <a
          href="https://www.whatismybrowser.com/guides/how-to-enable-javascript"
          rel="nofollow"
          >enable JavaScript</a
        >
        or
        <a href="https://browsehappy.com/" rel="nofollow">upgrade your browser</a
        >.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
  <!-- ~Fin~ -->
</html>
